<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Snack → GitHub</title>
    <link rel="stylesheet" href="../shared/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero-mark">S→G</div>
      <div>
        <h1>Snack <span class="arrow">→</span> GitHub</h1>
        <p class="subtitle">Do Expo Snack direto pro repo</p>
      </div>
    </header>

    <section class="win">
      <button id="zip-toggle" class="win-bar win-bar-toggle" type="button">
        <span class="wdot wdot-a"></span>
        <span class="wdot wdot-b"></span>
        <span class="wdot wdot-c"></span>
        <span class="win-title">1. Zip do Snack</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M3.5 6L8 10.5L12.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div id="zip-body" class="win-body">
        <div class="status-row">
          <span id="capture-dot" class="dot dot-off"></span>
          <span id="capture-text">Nenhum zip detectado ainda.</span>
        </div>
        <button id="grant-network" class="btn-flat" type="button" hidden>
          Conceder acesso de rede
        </button>

        <button id="download-fresh" class="btn-flat btn-flat-wide" type="button">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none">
            <path
              d="M8 2.8v9.4M4.2 8.5 8 12.3l3.8-3.8"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
            <path d="M3 13.6h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <span>Baixar novo zip do Snack</span>
        </button>

        <p class="hint hint-tight">Ou escolha um já baixado:</p>
        <div id="zip-list" class="zip-list"></div>
      </div>
    </section>

    <section class="win">
      <button id="destino-toggle" class="win-bar win-bar-toggle" type="button">
        <span class="wdot wdot-a"></span>
        <span class="wdot wdot-b"></span>
        <span class="wdot wdot-c"></span>
        <span class="win-title">2. Destino no GitHub</span>
        <svg class="chevron" width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M3.5 6L8 10.5L12.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div id="destino-body" class="win-body">
        <div class="status-row">
          <span id="token-dot" class="dot dot-off"></span>
          <span id="token-text">Token não configurado.</span>
          <button id="open-options" class="btn-link" type="button">Configurar token</button>
        </div>

        <div class="field-grid">
          <label>
            Dono / organização
            <input id="owner" type="text" placeholder="joaovictorcascardo" autocomplete="off" />
          </label>
          <label>
            Repositório
            <input id="repo" type="text" placeholder="meu-projeto-react-native" autocomplete="off" />
          </label>
        </div>

        <div class="row row-tight">
          <button id="create-repo-toggle" class="btn-link" type="button">+ Criar repositório novo</button>
        </div>

        <div id="create-repo-panel" class="create-repo-panel" hidden>
          <label>
            Nome do repositório
            <input id="new-repo-name" type="text" placeholder="meu-projeto-react-native" autocomplete="off" />
          </label>
          <label>
            Descrição (opcional)
            <input id="new-repo-desc" type="text" placeholder="Exercício de React Native" autocomplete="off" />
          </label>
          <label class="checkbox-row">
            <input id="new-repo-public" type="checkbox" checked />
            Público
          </label>

          <div class="create-repo-mode">
            <span class="create-repo-mode-title">Primeiro commit</span>
            <label class="radio-row">
              <input type="radio" name="first-commit" value="both" checked />
              README + arquivos do Snack
            </label>
            <label class="radio-row">
              <input type="radio" name="first-commit" value="files" />
              Só os arquivos do Snack
            </label>
            <label class="radio-row">
              <input type="radio" name="first-commit" value="readme" />
              Só um README
            </label>
          </div>

          <label id="new-repo-readme-field">
            Conteúdo do README
            <textarea id="new-repo-readme" rows="4"></textarea>
          </label>

          <div class="row create-repo-actions">
            <button id="new-repo-cancel" class="btn-flat" type="button">Cancelar</button>
            <button id="new-repo-create" class="btn-flat btn-flat-accent" type="button">Criar repositório</button>
          </div>
          <p id="new-repo-status" class="hint create-repo-status"></p>
        </div>

        <div class="field-grid">
          <label>
            Branch
            <input id="branch" type="text" placeholder="main" autocomplete="off" />
          </label>
          <label>
            Pasta no repo
            <div class="input-with-btn">
              <input id="subpath" type="text" list="subpath-history" placeholder="exercicio02" autocomplete="off" />
              <datalist id="subpath-history"></datalist>
              <button id="browse-folders" class="icon-btn" type="button" title="Escolher pasta no repo">
                <svg width="15" height="15" viewBox="0 0 16 16" fill="none">
                  <path
                    d="M2 4.3c0-.7.6-1.3 1.3-1.3h3l1.3 1.6h5.1c.7 0 1.3.6 1.3 1.3v6.8c0 .7-.6 1.3-1.3 1.3H3.3C2.6 14 2 13.4 2 12.7V4.3z"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </label>
        </div>
        <label>
          Mensagem de commit
          <input id="commit-message" type="text" autocomplete="off" />
        </label>

      </div>
    </section>

    <button id="push" class="btn-primary" type="button">
      <span>Commitar</span>
    </button>

    <section id="log-section" class="win" hidden>
      <div class="win-bar win-bar-log">
        <span class="wdot wdot-a"></span>
        <span class="wdot wdot-b"></span>
        <span class="wdot wdot-c"></span>
        <h2>Progresso</h2>
      </div>
      <div class="win-body">
        <pre id="log"></pre>
        <p id="result" hidden></p>
      </div>
    </section>

    <div id="folder-overlay" class="overlay" hidden>
      <section class="win overlay-win">
        <div class="win-bar">
          <span class="wdot wdot-a"></span>
          <span class="wdot wdot-b"></span>
          <span class="wdot wdot-c"></span>
          <h2>Escolher pasta</h2>
        </div>
        <div class="win-body">
          <div id="folder-breadcrumb" class="breadcrumb"></div>

          <div id="folder-status" class="hint"></div>
          <div id="folder-list" class="folder-list"></div>

          <div class="new-folder-row">
            <input id="new-folder-name" type="text" placeholder="nome-da-pasta-nova" autocomplete="off" />
            <button id="new-folder-add" class="btn-flat" type="button">Criar</button>
          </div>

          <div class="row overlay-actions">
            <button id="folder-cancel" class="btn-flat" type="button">Cancelar</button>
            <button id="folder-use" class="btn-primary overlay-use" type="button"><span>Usar esta pasta</span></button>
          </div>
        </div>
      </section>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
